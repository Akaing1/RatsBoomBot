name: UAT validation and deployment

on:
  pull_request:
    branches:
      - uat
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - uat
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-uat:
    name: Validate UAT
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      SESSION_SECRET: uat-ci-session-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app bot config storage web main.py

      - name: Run tests
        run: python -m pytest

  deploy-uat:
    name: Deploy UAT
    if: >-
      vars.UAT_DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      (startsWith(github.base_ref, 'release/') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository))
    needs: validate-uat
    runs-on:
      - self-hosted
      - linux
      - ratsboombot
    concurrency:
      group: uat-deployment
      cancel-in-progress: false
    env:
      UAT_DEPLOY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Deploy validated commit to isolated UAT instance
        run: /opt/ratsboombot-uat/deploy/linux/deploy-uat.sh "$UAT_DEPLOY_SHA"
