name: Version and release

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      initialize_discord_status:
        description: Create the one-time editable Discord status card
        required: true
        type: boolean
      publish_patch_note:
        description: Patch-note slug to announce (for example, crafting-and-consumables)
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require a newer application version
        shell: bash
        run: |
          version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' config/version.py)"

          if [[ -z "$version" ]]; then
            echo "config/version.py must define APP_VERSION using semantic versioning."
            exit 1
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"

          if [[ -z "$latest_tag" ]]; then
            echo "No published release exists yet; v${version} is valid."
            exit 0
          fi

          python - "$version" "${latest_tag#v}" <<'PY'
          import sys

          current = tuple(map(int, sys.argv[1].split(".")))
          latest = tuple(map(int, sys.argv[2].split(".")))

          if current <= latest:
              raise SystemExit(f"APP_VERSION must be newer than the latest release ({sys.argv[2]}).")

          print(f"Version {sys.argv[1]} is newer than {sys.argv[2]}.")
          PY

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish unreleased application version
        shell: bash
        run: |
          version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' config/version.py)"

          if [[ -z "$version" ]]; then
            echo "config/version.py must define APP_VERSION using semantic versioning."
            exit 1
          fi

          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to publish."
            exit 0
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "RatsBoomBot ${tag}" \
            --generate-notes

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push'
    needs: publish-release
    runs-on:
      - self-hosted
      - linux
      - ratsboombot
    permissions:
      contents: read
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Mark Discord status as updating
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_STATUS_MESSAGE_ID }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" || -z "$DISCORD_MESSAGE_ID" ]]; then exit 0; fi
          content=$'🟡 **RatsBoomBot Status**\n**Production:** Deploying an update…'
          payload="$(CONTENT="$content" python3 -c 'import json, os; print(json.dumps({"content": os.environ["CONTENT"], "username": "RatsBoomBot"}))')"
          curl --fail --silent --show-error -X PATCH -H 'Content-Type: application/json' -d "$payload" "${DISCORD_WEBHOOK_URL}/messages/${DISCORD_MESSAGE_ID}"

      - name: Deploy RatsBoomBot on Raspberry Pi
        run: /opt/ratsboombot/deploy/linux/deploy.sh

  notify-testing-chamber:
    name: Notify testing chamber
    if: always() && github.event_name == 'push'
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Post deployment result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_TESTING_CHAMBER_WEBHOOK_URL }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-production.result }}
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "Discord webhook secret is not configured; skipping notification."
            exit 0
          fi

          version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' config/version.py)"
          if [[ "$DEPLOYMENT_RESULT" == "success" ]]; then
            content=$'✅ **RatsBoomBot v'"${version}"$' deployed successfully**\n<https://github.com/'"${GITHUB_REPOSITORY}"$'/releases/tag/v'"${version}"$'>'
          else
            content=$'🚨 **RatsBoomBot production deployment failed**\n<https://github.com/'"${GITHUB_REPOSITORY}"$'/actions/runs/'"${GITHUB_RUN_ID}"$'>'
          fi

          payload="$(CONTENT="$content" python3 -c 'import json, os; print(json.dumps({"content": os.environ["CONTENT"], "username": "RatsBoomBot"}))')"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"

  update-discord-status:
    name: Update Discord status card
    if: always() && github.event_name == 'push'
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update the saved status card
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_STATUS_MESSAGE_ID }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-production.result }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" || -z "$DISCORD_MESSAGE_ID" ]]; then exit 0; fi
          version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' config/version.py)"
          if [[ "$DEPLOYMENT_RESULT" == "success" ]]; then content=$'🟢 **RatsBoomBot Status**\n**Production:** Healthy and active\n**Version:** v'"${version}"; else content=$'🔴 **RatsBoomBot Status**\n**Production:** Deployment failed\n<https://github.com/'"${GITHUB_REPOSITORY}"$'/actions/runs/'"${GITHUB_RUN_ID}"$'>'; fi
          payload="$(CONTENT="$content" python3 -c 'import json, os; print(json.dumps({"content": os.environ["CONTENT"], "username": "RatsBoomBot"}))')"
          curl --fail --silent --show-error -X PATCH -H 'Content-Type: application/json' -d "$payload" "${DISCORD_WEBHOOK_URL}/messages/${DISCORD_MESSAGE_ID}"

  initialize-discord-status:
    name: Initialize Discord status card
    if: github.event_name == 'workflow_dispatch' && inputs.initialize_discord_status
    runs-on: ubuntu-latest
    steps:
      - name: Create the status card and print its ID
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
        run: |
          response="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"content":"⚪ **RatsBoomBot Status**\n**Production:** Status monitoring is being initialized","username":"RatsBoomBot"}' "${DISCORD_WEBHOOK_URL}?wait=true")"
          message_id="$(jq -r '.id' <<< "$response")"
          echo "Create the repository variable DISCORD_STATUS_MESSAGE_ID with this value: ${message_id}"

  publish-patch-note:
    name: Publish patch-note announcement
    if: github.event_name == 'workflow_dispatch' && inputs.publish_patch_note != ''
    runs-on: ubuntu-latest
    steps:
      - name: Announce the selected patch note
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK_URL }}
          PATCH_NOTE: ${{ inputs.publish_patch_note }}
        run: |
          if [[ "$PATCH_NOTE" != "crafting-and-consumables" ]]; then echo "Unknown patch-note slug: $PATCH_NOTE"; exit 1; fi
          content=$'**Rats RPG Patch Notes — Crafting & Consumables**\nCrafting is here: build Basic weapons into Refined and Masterwork gear, prepare with new raid consumables, and chase stronger Mythical drops.\n\n**Highlights**\n• Refined and Masterwork weapon progression\n• Mythical weapons now add +225 damage\n• Second Wind, Berserk, and Blessing consumables\n\nRead the complete patch notes: <https://ratsboombot.com/patch-notes/crafting-and-consumables>'
          payload="$(CONTENT="$content" python3 -c 'import json, os; print(json.dumps({"content": os.environ["CONTENT"], "username": "RatsBoomBot"}))')"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"
