<div class="channel-page-controls">
    <div class="header-actions">
        <a class="button secondary" href="/admin/channels">Back to Channels</a>
        {% if broadcaster.login %}
        <a class="button primary" href="https://twitch.tv/{{ broadcaster.login }}" target="_blank" rel="noopener noreferrer">Open Twitch</a>
        {% endif %}
    </div>
    <nav class="channel-page-tabs" aria-label="Channel management sections">
        <a class="channel-page-tab {% if channel_section == 'overview' %}active{% endif %}" href="/admin/channels/{{ broadcaster.id }}" {% if channel_section == 'overview' %}aria-current="page"{% endif %}>Overview</a>
        {% for key, label in [('settings', 'Settings'), ('monitor', 'Monitor')] %}
        <a class="channel-page-tab {% if channel_section == key %}active{% endif %}" href="/admin/channels/{{ broadcaster.id }}/{{ key }}" {% if channel_section == key %}aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
    </nav>
</div>
