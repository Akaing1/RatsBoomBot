<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}RatsBoomBot Admin{% endblock %}
    </title>

    <link rel="icon" href="{{ url_for('assets', path='/NinjaDoro.ico') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}?v={{ deployment_stamp() }}"
    >
</head>

<body class="dashboard-page admin-page admin-page-{{ active_page }}">
    <div class="app-shell" data-dashboard-shell data-sidebar-storage-key="ratsboombot-admin-sidebar-collapsed">
        <aside class="sidebar">
            <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-expanded="true" aria-label="Collapse navigation" title="Collapse navigation"><span aria-hidden="true">‹</span></button>
            <div class="brand">
                <img class="brand-mark" src="{{ url_for('assets', path='/NinjaDoro.ico') }}" alt="RatsBoomBot icon">

                <div class="brand-copy">
                    <h1>RatsBoomBot</h1>
                    <p>Admin Control</p>
                </div>
            </div>

            <nav class="navigation">
                <a
                    class="nav-link {% if active_page == 'dashboard' %}active{% endif %}"
                    href="/admin"
                >
                    <span class="nav-link-icon" aria-hidden="true">⌂</span><span class="nav-link-label">Dashboard</span>
                </a>

                <a
                    class="nav-link {% if active_page == 'channels' %}active{% endif %}"
                    href="/admin/channels"
                >
                    <span class="nav-link-icon" aria-hidden="true">◉</span><span class="nav-link-label">Channels</span>
                </a>

                {% if administrator and administrator.role == "owner" %}
                    <a
                        class="nav-link {% if active_page == 'users' %}active{% endif %}"
                        href="/admin/users"
                    >
                        <span class="nav-link-icon" aria-hidden="true">♙</span><span class="nav-link-label">Users</span>
                    </a>
                {% endif %}

                <a
                    class="nav-link {% if active_page == 'performance' %}active{% endif %}"
                    href="/admin/performance"
                >
                    <span class="nav-link-icon" aria-hidden="true">⌁</span><span class="nav-link-label">Performance</span>
                </a>

                <a
                    class="nav-link {% if active_page == 'runtime_logs' %}active{% endif %}"
                    href="/admin/runtime-logs"
                >
                    <span class="nav-link-icon" aria-hidden="true">≡</span><span class="nav-link-label">Runtime Logs</span>
                </a>

                <a
                    class="nav-link {% if active_page == 'logs' %}active{% endif %}"
                    href="/admin/logs"
                >
                    <span class="nav-link-icon" aria-hidden="true">▤</span><span class="nav-link-label">Stream Logs</span>
                </a>
                <a class="nav-link {% if active_page == 'patch_notes' %}active{% endif %}" href="/admin/patch-notes"><span class="nav-link-icon" aria-hidden="true">✎</span><span class="nav-link-label">Patch Notes</span></a>

                <a
                    class="nav-link {% if active_page == 'account' %}active{% endif %}"
                    href="/admin/account/password"
                >
                    <span class="nav-link-icon" aria-hidden="true">⚙</span><span class="nav-link-label">Account</span>
                </a>
            </nav>

            <form class="sidebar-logout" method="post" action="/admin/logout">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >

                <button class="button secondary" type="submit">
                    <span class="nav-link-icon" aria-hidden="true">↪</span><span class="sidebar-button-label">Log Out</span>
                </button>
            </form>

            <p class="deployment-stamp">{{ deployment_stamp() }}</p>
        </aside>

        <main class="main-content admin-main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', path='/js/channel-sidebar.js') }}?v={{ deployment_stamp() }}" defer></script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
