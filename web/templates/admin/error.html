{% extends "admin/layout.html" %}

{% block title %}{{ title }} | RatsBoomBot{% endblock %}

{% block content %}
<section class="message-card error-card">
    <div class="message-icon">!</div>
    <p class="eyebrow">Something went wrong</p>
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <a class="button secondary" href="/admin">Return to dashboard</a>
</section>
{% endblock %}
