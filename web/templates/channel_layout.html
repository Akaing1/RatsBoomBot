<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}RatsBoomBot Channel{% endblock %}
    </title>

    <link rel="icon" href="{{ url_for('assets', path='/NinjaDoro.ico') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}?v=6"
    >
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <img
                    class="brand-mark"
                    src="{{ url_for('assets', path='/NinjaDoro.ico') }}"
                    alt="RatsBoomBot icon"
                >

                <div>
                    <h1>RatsBoomBot</h1>
                    <p>Streamer Control</p>
                </div>
            </div>

            <nav class="navigation">
                <a
                    class="nav-link {% if active_page == 'overview' %}active{% endif %}"
                    href="/channel"
                >
                    Overview
                </a>

                <a
                    class="nav-link {% if active_page == 'features' %}active{% endif %}"
                    href="/channel/features"
                >
                    Features
                </a>
            </nav>

            <form class="sidebar-logout" method="post" action="/channel/logout">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <button class="button secondary" type="submit">
                    Sign Out
                </button>
            </form>
        </aside>

        <main class="main-content streamer-main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
