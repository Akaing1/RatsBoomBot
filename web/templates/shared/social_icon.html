{% macro social_icon(platform) -%}
{% set platform = 'x' if platform == 'twitter' else platform %}
{% if platform == 'website' %}
<svg class="social-platform-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6h14M5 18h14"/></svg>
{% elif platform in ['twitch', 'youtube', 'discord', 'tiktok', 'x', 'kofi', 'vgen', 'throne'] %}
<img class="social-platform-icon" src="/static/img/socials/{{ platform }}.{{ 'png' if platform == 'vgen' else 'svg' }}" width="16" height="16" alt="" aria-hidden="true">
{% endif %}
{%- endmacro %}
