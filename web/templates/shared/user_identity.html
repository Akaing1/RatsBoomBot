{% macro user_identity(user_id, login, display_name, profile_image_url='') %}
<span class="protected-user-avatar" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
    {% if profile_image_url %}<img src="{{ profile_image_url }}" alt="" width="28" height="28" loading="lazy" decoding="async" onerror="this.hidden=true">{% endif %}
</span>
<div class="user-list-identity">
    <strong>{{ display_name or login }}{% if login and display_name and display_name | lower != login | lower %} <span>({{ login }})</span>{% endif %}</strong>
    <small>{{ user_id or 'User ID unavailable' }}</small>
</div>
{% endmacro %}
