<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patch Notes | RatsBoomBot</title><link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}?v={{ deployment_stamp() }}"></head><body class="chatter-profile-page"><main class="chatter-profile-content"><a class="landing-brand" href="/"><span><strong>RatsBoomBot</strong><small>Patch notes</small></span></a><header class="chatter-profile-hero"><div><p class="eyebrow">Rats Boom Bot updates</p><h1>Patch Notes</h1></div></header>{% for note in patch_notes %}<article class="panel"><p class="eyebrow">v{{ note.version }} · {{ note.published_at }}</p><h2>{{ note.title }}</h2><p>{{ note.synopsis }}</p><a class="button primary" href="/patch-notes/{{ note.slug }}">Read patch notes</a></article>{% endfor %}</main></body></html>
