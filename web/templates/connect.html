<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Connect with Twitch | RatsBoomBot</title>

    <link rel="icon" href="{{ url_for('assets', path='/NinjaDoro.ico') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}?v=6"
    >
</head>

<body class="login-page">
    <main class="login-card">
        <div class="brand login-brand">
            <img
                class="brand-mark"
                src="{{ url_for('assets', path='/NinjaDoro.ico') }}"
                alt="RatsBoomBot icon"
            >

            <div>
                <h1>RatsBoomBot</h1>
                <p>Channel Connection</p>
            </div>
        </div>

        <p class="eyebrow">Streamer access</p>

        <h2>Connect Your Channel</h2>

        <p class="page-description">
            Sign in with Twitch to connect your channel to RatsBoomBot.
        </p>

        <a class="button primary" href="/connect/twitch">
            Connect with Twitch
        </a>
    </main>
</body>
</html>
