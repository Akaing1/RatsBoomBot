<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}RatsBoomBot Channel{% endblock %}
    </title>

    <link rel="icon" href="{{ url_for('assets', path='/NinjaDoro.ico') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}?v={{ deployment_stamp() }}"
    >
</head>

<body class="dashboard-page channel-page channel-page-{{ active_page }}">
    <div class="app-shell" data-dashboard-shell data-sidebar-storage-key="ratsboombot-channel-sidebar-collapsed">
        <aside class="sidebar" data-channel-sidebar>
            <button
                class="sidebar-toggle"
                type="button"
                data-sidebar-toggle
                aria-expanded="true"
                aria-label="Collapse navigation"
                title="Collapse navigation"
            >
                <span aria-hidden="true">‹</span>
            </button>
            <div class="brand">
                <img
                    class="brand-mark"
                    src="{{ url_for('assets', path='/NinjaDoro.ico') }}"
                    alt="RatsBoomBot icon"
                >

                <div class="brand-copy">
                    <h1>RatsBoomBot</h1>
                    <p class="sidebar-brand-subtitle">Streamer Control</p>
                </div>
            </div>
            {% if active_page == 'overview' %}
            <span class="dashboard-carousel-navbar-label" data-dashboard-carousel-position role="status" aria-live="polite"><span class="dashboard-carousel-navbar-count" data-dashboard-carousel-count>1 / 4 ·</span><span class="dashboard-carousel-navbar-name" data-dashboard-carousel-name>Stream and Ads</span></span>
            {% endif %}

            <nav class="navigation">
                <a
                    class="nav-link {% if active_page == 'overview' %}active{% endif %}"
                    href="/channel"
                >
                    <span class="nav-link-icon" aria-hidden="true">⌂</span>
                    <span class="nav-link-label">Overview</span>
                </a>

                <a
                    class="nav-link {% if active_page == 'features' %}active{% endif %}"
                    href="/channel/features"
                >
                    <span class="nav-link-icon" aria-hidden="true">✦</span>
                    <span class="nav-link-label">Features</span>
                </a>

                <a
                    class="nav-link {% if active_page == 'customization' %}active{% endif %}"
                    href="/channel/customization"
                >
                    <span class="nav-link-icon" aria-hidden="true">⚙</span>
                    <span class="nav-link-label">Customization</span>
                </a>

                <a class="nav-link {% if active_page == 'loyalty' %}active{% endif %}" href="/channel/loyalty">
                    <span class="nav-link-icon" aria-hidden="true">★</span>
                    <span class="nav-link-label">Loyalty Points</span>
                </a>

                <a
                    class="nav-link {% if active_page == 'help' %}active{% endif %}"
                    href="/channel/help"
                >
                    <span class="nav-link-icon" aria-hidden="true">?</span>
                    <span class="nav-link-label">Help</span>
                </a>
            </nav>

            <form class="sidebar-logout" method="post" action="/channel/logout">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <button class="button secondary" type="submit">
                    <span class="nav-link-icon" aria-hidden="true">↪</span>
                    <span class="sidebar-button-label">Sign Out</span>
                </button>
            </form>
        </aside>

        <main class="main-content streamer-main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', path='/js/channel-sidebar.js') }}?v={{ deployment_stamp() }}" defer></script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
