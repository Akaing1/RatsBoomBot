{% macro status_switch(toggle, labeled=false) %}
{% set blocked = toggle.state.blocked_by_profile or toggle.state.blocked_by_globals | default(false) %}
<span class="settings-inline-switch">
    {% if labeled %}<span class="settings-switch-label">{{ toggle.label }}</span>{% endif %}
    <button class="settings-status-switch {{ 'enabled' if toggle.state.effective_enabled else 'disabled' }}" type="submit" form="settings-toggle-{{ toggle.kind }}-{{ toggle.name }}" name="action" value="{{ 'disable' if toggle.state.effective_enabled else 'enable' }}" role="switch" aria-checked="{{ 'true' if toggle.state.effective_enabled else 'false' }}" aria-label="{{ toggle.label }}"{% if blocked %} disabled title="Enable the channel profile and global commands in General first."{% else %} title="{{ 'Disable' if toggle.state.effective_enabled else 'Enable' }} {{ toggle.label }}"{% endif %}>{{ 'Enabled' if toggle.state.effective_enabled else 'Disabled' }}</button>
</span>
{% endmacro %}
