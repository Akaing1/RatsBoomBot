{% from "shared/state_toggle.html" import state_toggle_contents as switch_contents %}
<form id="dashboard-settings" method="post" action="{{ customization_action | default('/channel/customization') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="setting_name" value="dashboard.follow_raid">
    <input type="hidden" name="action" value="save">
    <header class="settings-group-heading"><h4>Follow outgoing raids</h4><span class="settings-header-switches">
        <button class="settings-status-switch state-toggle queue-state-toggle{% if channel_settings.follow_raid %} live{% endif %}" type="submit" name="value" value="{{ '0' if channel_settings.follow_raid else '1' }}" role="switch" aria-label="Follow outgoing raids" aria-checked="{{ 'true' if channel_settings.follow_raid else 'false' }}">{{ switch_contents(channel_settings.follow_raid) }}</button>
    </span></header>
    <p class="settings-toggle-description">Open the destination channel after your outgoing raid countdown finishes.</p>
</form>
