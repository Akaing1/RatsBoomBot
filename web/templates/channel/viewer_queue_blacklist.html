    <form class="queue-blacklist-add" data-settings-inline-save data-settings-immediate-action method="post" action="{{ channel_root }}/viewer-queue/blacklist">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="action" value="add">
        <label for="queue-blacklist-username">Twitch username</label>
        <div>
            <input id="queue-blacklist-username" name="username" required maxlength="50" placeholder="username" autocomplete="off">
            <button class="button primary" type="submit">Add to blacklist</button>
        </div>
    </form>

    <div data-queue-blacklist-members>
    {% if blacklist %}
        <ul class="queue-blacklist-list">
            {% for member in blacklist %}
                <li>
                    <strong>{{ member.label }}</strong>
                    <form data-settings-inline-save data-settings-immediate-action method="post" action="{{ channel_root }}/viewer-queue/blacklist">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <input type="hidden" name="action" value="remove">
                        <input type="hidden" name="username" value="{{ member.username }}">
                        <button class="button danger" type="submit">Remove</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="compact-empty-state"><h4>No blacklisted players</h4><p>Anyone can join while the queue is open.</p></div>
    {% endif %}
    </div>
