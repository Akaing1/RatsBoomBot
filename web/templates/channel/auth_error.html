<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | RatsBoomBot</title>
    <link rel="icon" href="{{ url_for('assets', path='/NinjaDoro.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}?v={{ deployment_stamp() }}">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="brand login-brand">
            <img class="brand-mark" src="{{ url_for('assets', path='/NinjaDoro.ico') }}" alt="">
            <div><h1>RatsBoomBot</h1><p>Channel connection</p></div>
        </div>
        <h2>{{ title }}</h2>
        <p class="page-description">{{ message }}</p>
        <a class="button primary" href="/connect/twitch">Try channel sign-in again</a>
        <a class="button secondary" href="/">Return home</a>
    </main>
</body>
</html>
